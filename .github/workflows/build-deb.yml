name: build-deb

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    # Debian 13 (trixie) is what PVE 9 is built on: same glibc, same rustc.
    container: debian:trixie

    steps:
      - name: Install build dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential ca-certificates debhelper devscripts git lintian \
            cargo rustc librust-libc-dev shellcheck

      - uses: actions/checkout@v4

      - name: Check debian/changelog matches Cargo.toml version
        run: |
          deb=$(dpkg-parsechangelog --show-field Version)
          proj=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          echo "changelog=$deb cargo=$proj"
          if [ "$deb" != "$proj" ]; then
            echo "::error::version mismatch: debian/changelog is $deb, Cargo.toml is $proj"
            exit 1
          fi

      - name: Shell scripts (shellcheck + fake-PVE harness)
        run: |
          shellcheck contrib/passthrough-memory-guard.sh contrib/pve-passthrough-guard-sync tests/guard.sh
          tests/guard.sh

      # Runs the unit suite too (override_dh_auto_test).
      - name: Build package
        run: dpkg-buildpackage -us -uc -b

      - name: Collect artifacts
        run: |
          mkdir -p dist
          cp ../*.deb dist/
          ls -la dist/

      - name: Lintian
        run: lintian --fail-on error --no-tag-display-limit dist/*.deb

      - name: Smoke test the installed package
        run: |
          DEBIAN_FRONTEND=noninteractive apt-get install -y ./dist/*.deb
          pve-wedge-watchdog --version
          pve-wedge-watchdog --check-config | grep -q 'dry_run: true'
          # Dry run must never touch a device; run it briefly and stop it.
          timeout -s INT 3 pve-wedge-watchdog --dry-run || [ $? -eq 124 ]
          test ! -e /etc/systemd/system/multi-user.target.wants/pve-wedge-watchdog.service
          test -x /usr/share/pve-wedge-watchdog/passthrough-memory-guard.sh
          test -x /usr/sbin/pve-passthrough-guard-sync
          test -e /etc/systemd/system/multi-user.target.wants/pve-passthrough-guard-sync.service
          test -e /etc/systemd/system/timers.target.wants/pve-passthrough-guard-sync.timer

      - uses: actions/upload-artifact@v4
        with:
          name: pve-wedge-watchdog-deb
          path: dist/*.deb
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: pve-wedge-watchdog-deb
          path: dist

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.deb
          generate_release_notes: true
