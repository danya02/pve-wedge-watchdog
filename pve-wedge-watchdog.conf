# /etc/pve-wedge-watchdog.conf — read once at startup; restart to apply.
# key = value, '#' comments. Unknown keys are an error.

# Ships in dry-run: verdicts are logged, no watchdog is opened. Set to false
# only after testing per /usr/share/doc/pve-wedge-watchdog/testing.md.
dry_run = true

# A watchdog device that is NOT the one watchdog-mux holds (/dev/watchdog0).
# See README "Which watchdog device". Last resort: mux:/run/watchdog-mux.sock
watchdog = /dev/watchdog1
watchdog_timeout = 60          # seconds; mux requires exactly 60
pet_interval = 5

# Memory PSI. Trigger: "<some|full> <stall_us> <window_us>"; empty disables.
psi_path = /proc/pressure/memory
psi_trigger = full 500000 2000000
psi_avg10_threshold = 20       # probe failure while full avg10 >= this: reboot
psi_hard_threshold = 40        # full avg10 >= this ...
psi_hard_seconds = 180         # ... for this long: reboot, probe or not

# SSH banner probe (ip:port, no DNS; "none" disables).
probe_addr = 127.0.0.1:22
probe_interval = 30
probe_timeout = 10
probe_failures = 3             # consecutive failures that mean "wedged"
startup_grace = 120            # seconds after BOOT during which failures are ignored

# Also write 'b' to /proc/sysrq-trigger this long after the verdict, in case
# the watchdog device does not fire. Immediate reboot: no sync, no unmount.
sysrq_reboot = false
sysrq_grace = 30
